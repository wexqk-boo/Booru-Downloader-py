[project]
name = "bdl"
version = "2.1.0"
description = "Async batch downloader and sync tool for booru boards"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["booru", "downloader", "gelbooru", "rule34", "danbooru", "asyncio", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "aiohttp>=3.10,<4",
    "aiofiles>=24.1",
    "aiosqlite>=0.20",
    "imagehash>=4.3",
    "pillow>=10",
    "rapidfuzz>=3",
    "rich>=13",
    "questionary>=2.0",
    "uvloop>=0.21; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/wexqk-boo/Booru-Downloader-py"
Issues = "https://github.com/wexqk-boo/Booru-Downloader-py/issues"

[project.scripts]
bdl = "bdl.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bdl*"]

[tool.setuptools.package-data]
bdl = ["i18n/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003"]
